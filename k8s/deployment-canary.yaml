apiVersion: apps/v1
kind: Deployment
metadata:
  name: godzilla-api-canary
  labels:
    app: godzilla-api
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: godzilla-api
      version: canary
  template:
    metadata:
      labels:
        app: godzilla-api
        version: canary
    spec:
      containers:
        - name: godzilla-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: RELEASE_CHANNEL
              value: "canary"
            - name: APP_VERSION
              value: "1.1.0-canary"
            - name: APP_ENV
              value: "production"
            - name: VISIBLE_CHANGE
              value: "Canary release enabled"
            - name: LOG_LEVEL
              value: "info"
            - name: DEPLOY_DATE
              value: "DEPLOY_DATE_PLACEHOLDER"
            - name: GIT_SHA
              value: "GIT_SHA_PLACEHOLDER"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: godzilla-db-secret
                  key: DATABASE_URL
