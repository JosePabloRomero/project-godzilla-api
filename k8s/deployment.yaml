apiVersion: apps/v1
kind: Deployment
metadata:
  name: godzilla-api
  labels:
    app: godzilla-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: godzilla-api
  template:
    metadata:
      labels:
        app: godzilla-api
    spec:
      containers:
        - name: godzilla-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: godzilla-db-secret
                  key: DATABASE_URL
